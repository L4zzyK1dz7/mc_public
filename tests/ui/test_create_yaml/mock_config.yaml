simulation:
  replications: 5
  time_limit_sec: 3600.0
  world_timestep_sec: 1.0
  detection_end_condition: initial_detection # initial_detection or team_detection
  seeds_file: true
world:
  origin_x: 0.0
  origin_y: 0.0
  length: 1000000.0
  height: 800000.0

