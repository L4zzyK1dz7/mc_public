platforms:
  - display_name: Platform 1
    movement_type:
      type: user_defined_waypoints
      waypoints:
        - x: 30000.0
          y: 80000.0
    neutralised_platform_behaviour: stop
    platform_config_folder: Platform 1
    sensors:
      - generic
    speed_mps: 0.0
    team: Blue
  - display_name: Platform 2
    movement_type:
      type: random_walk
    neutralised_platform_behaviour: stop
    platform_config_folder: Platform 2
    sensors:
      - generic
    speed_mps: 0.0
    team: Blue
  - display_name: Platform 3
    movement_type:
      type: random_walk
    neutralised_platform_behaviour: stop
    platform_config_folder: Platform 3
    sensors: []
    speed_mps: 10.0
    team: Red
simulation:
  detection_end_condition: initial_detection
  replications: 100
  seeds_file: true
  time_limit_sec: 3600.0
  timestep_sec: 1.0
sonobuoy_field:
  data_fusion_requirement: 3
sonobuoys:
  - display_name: Buoy 1
    evaluation_modes:
      - single
      - multi
      - single_cycle
    k: 3
    n: 5
    x_m: 20000.0
    y_m: 50000.0
  - display_name: Buoy 2
    evaluation_modes:
      - single
      - multi
      - single_cycle
    k: 3
    n: 5
    x_m: 50000.0
    y_m: 50000.0
  - display_name: Buoy 3
    evaluation_modes:
      - single
      - multi
      - single_cycle
    k: 3
    n: 5
    x_m: 80000.0
    y_m: 50000.0
world:
  height: 100000.0
  length: 100000.0
  origin_x: 0.0
  origin_y: 0.0
